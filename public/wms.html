<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 antialiased">

  <!-- ===================================================================== -->

    /**

          },
          {

            minStock: 8,
            stock: {
              central: 28,
              branch1: 4,

              branch3: 3
            }
          }
        ],
        // ใบคำขอเบิกรออนุมัติตั้งต้น
        requisitions: [
          {
            id: 'REQ-2026-001',
            branchId: 'branch1',
            createdAt: formatTimeOffset(45),
            processedAt: null,
            status: 'pending', // 'pending' | 'approved_full' | 'approved_partial' | 'rejected'

              { productId: 'P002', requestedQty: 10, approvedQty: null },

          },
          {

            branchId: 'branch2',
            createdAt: formatTimeOffset(20),
            processedAt: null,
            status: 'pending',
            branchNote: 'ขอเบิกอาหารแมวปลาทูกับอาหารลูกสุนัขเติมสต็อกช่วงสุดสัปดาห์ครับ',
            adminNote: '',

              { productId: 'P002', requestedQty: 6, approvedQty: null },
              { productId: 'P003', requestedQty: 5, approvedQty: null }
            ]
          }
        ],
        // ประวัติการเคลื่อนไหวสต็อก (Audit Logs)
        movements: [
          {
            id: 'MOV-1001',
            timestamp: formatTimeOffset(180),
            type: 'restock', // 'restock' | 'dispatch' | 'sale' | 'new_product'
            locationId: 'central',
            productId: 'P002',
            qtyChange: 12,
            detail: 'รับสินค้าเข้าคลังกลางเริ่มต้น (ล็อตประจำสัปดาห์จากโรงงาน)'
          },
          {
            id: 'MOV-1002',
            timestamp: formatTimeOffset(95),
            type: 'sale',
            locationId: 'branch1',
            productId: 'P002',
            qtyChange: -3,
            detail: 'ขายหน้าร้าน สาขา 1 (ในเมือง) จำนวน 3 กระสอบ'
          },
          {
            id: 'MOV-1003',
            timestamp: formatTimeOffset(60),
            type: 'sale',
            locationId: 'branch3',
            productId: 'P005',
            qtyChange: -4,
            detail: 'ขายหน้าร้าน สาขา 3 (อำเภอ) จำนวน 4 กระสอบ (สินค้าหมดหน้าร้าน)'
          }
        ],
        // ฟอร์มสร้างใบเบิกชั่วคราวฝั่งสาขา
        draftRequisition: {
          note: '',
          items: [
            { productId: 'P001', qty: 5 }
          ]
        },
        // ค่าตัวเลขจ่ายจริงชั่วคราวที่ Admin กรอกในแต่ละใบเบิก
        approvalDrafts: {},
        // ตัวกรองประวัติการเคลื่อนไหว (Audit Logs)
        historyFilter: {
          location: 'all',
          type: 'all',
          search: ''
        }
      };
    }

    // =========================================================================
    // 2. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
    // =========================================================================
    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.products) && Array.isArray(parsed.requisitions)) {
            return {
              ...createInitialState(),
              ...parsed
            };
          }
        }
      } catch (err) {
        console.error('ไม่สามารถโหลดข้อมูลจาก localStorage:', err);
      }
      return createInitialState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('ไม่สามารถบันทึกข้อมูลลง localStorage:', err);
      }
    }

    // =========================================================================
    // 3. HELPER FUNCTIONS
    // =========================================================================
    function getAccount(userId) {
      return USER_ACCOUNTS.find(u => u.id === userId) || null;
    }

    function getBranchAccounts() {
      return USER_ACCOUNTS.filter(u => u.roleType === 'branch');
    }

    function getProduct(productId) {
      return appState.products.find(p => p.id === productId);
    }

    function formatThaiDateTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      return d.toLocaleDateString('th-TH', {
        day: '2-digit',
        month: 'short',
        year: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }) + ' น.';
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * คำนวณยอดขอเบิกที่กำลังรออนุมัติทั้งหมดของสินค้าแต่ละชนิด (ทั้งระบบ)
     */
    function getPendingDemandMap() {
      const demand = {};
      appState.products.forEach(p => {
        demand[p.id] = 0;
      });
      appState.requisitions
        .filter(r => r.status === 'pending')
        .forEach(req => {
          req.items.forEach(item => {
            if (demand[item.productId] !== undefined) {
              demand[item.productId] += Number(item.requestedQty) || 0;
            }
          });
        });
      return demand;
    }

    /**
     * คำนวณยอดขอเบิกที่กำลังรออนุมัติเฉพาะของสาขาที่ระบุ
     */
    function getBranchPendingDemandMap(branchId) {
      const demand = {};
      appState.products.forEach(p => {
        demand[p.id] = 0;
      });
      appState.requisitions
        .filter(r => r.status === 'pending' && r.branchId === branchId)
        .forEach(req => {
          req.items.forEach(item => {
            if (demand[item.productId] !== undefined) {
              demand[item.productId] += Number(item.requestedQty) || 0;
            }
          });
        });
      return demand;
    }

    function generateNextReqId() {
      const num = appState.requisitions.length + 1;
      return `REQ-2026-${String(num).padStart(3, '0')}`;
    }

    // =========================================================================
    // 4. TOAST & MODAL SYSTEM (แทน alert / confirm ทั้งหมด)
    // =========================================================================
    function showToast(title, message = '', type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      const styles = {
        success: {
          bg: 'bg-emerald-900 border-emerald-700 text-white',
          iconBg: 'bg-emerald-500/20 text-emerald-300',
          icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />`
        },
        warning: {
          bg: 'bg-amber-900 border-amber-700 text-white',
          iconBg: 'bg-amber-500/20 text-amber-300',
          icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />`
        },
        error: {
          bg: 'bg-rose-900 border-rose-700 text-white',
          iconBg: 'bg-rose-500/20 text-rose-300',
          icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />`
        }
      };

      const st = styles[type] || styles.success;

      toast.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl border shadow-xl toast-enter ${st.bg}`;
      toast.innerHTML = `
        <div class="w-8 h-8 rounded-lg ${st.iconBg} flex items-center justify-center shrink-0 mt-0.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            ${st.icon}
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold leading-snug">${escapeHtml(title)}</p>
          ${message ? `<p class="text-xs opacity-90 mt-0.5 leading-relaxed">${escapeHtml(message)}</p>` : ''}
        </div>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 260);
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modalBackdrop');
      const box = document.getElementById('modalBox');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.add('hidden');
    }

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') {
        closeModal();
      }
    });

    function openResetModal() {
      openModal(`
        <div class="p-6">
          <div class="flex items-center gap-3 text-rose-600 mb-3">
            <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center shrink-0">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900">ยืนยันการรีเซ็ตข้อมูลเริ่มต้น?</h3>
          </div>
          <p class="text-sm text-slate-600 leading-relaxed mb-6">
            ข้อมูลสต็อกสินค้า ใบคำขอเบิก และประวัติการทำรายการทั้งหมดจะถูกรีเซ็ตกลับไปเป็นค่าเริ่มต้นสำหรับทดสอบระบบใหม่ คุณต้องการดำเนินการต่อหรือไม่?
          </p>
          <div class="flex items-center justify-end gap-2.5">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition cursor-pointer">
              ยกเลิก
            </button>
            <button onclick="confirmResetData()" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition cursor-pointer">
              ยืนยันรีเซ็ตข้อมูล
            </button>
          </div>
        </div>
      `);
    }

    function confirmResetData() {
      const loggedInUser = appState.currentUser;
      appState = createInitialState();
      appState.currentUser = loggedInUser;
      if (loggedInUser) {
        const acc = getAccount(loggedInUser);
        appState.activeTab = acc && acc.roleType === 'admin' ? 'approvals' : 'branch_stock';
      }
      saveState();
      closeModal();
      renderApp();
      showToast('รีเซ็ตข้อมูลเรียบร้อยแล้ว', 'โหลดข้อมูลสินค้า 6 รายการและใบขอเบิกจำลองเริ่มต้นใหม่ทั้งหมด', 'success');
    }

    // =========================================================================
    // 5. AUTHENTICATION & NAVIGATION ACTIONS
    // =========================================================================
    let loginErrorMessage = '';
    let showLoginPassword = false;

    function toggleLoginPasswordVisibility() {
      showLoginPassword = !showLoginPassword;
      const pwdInput = document.getElementById('loginPasswordInput');
      if (pwdInput) {
        pwdInput.type = showLoginPassword ? 'text' : 'password';
      }
    }

    function handleLoginSubmit(event) {
      if (event) event.preventDefault();
      const username = (document.getElementById('loginUsernameInput')?.value || '').trim().toLowerCase();
      const password = (document.getElementById('loginPasswordInput')?.value || '').trim();

      const matched = USER_ACCOUNTS.find(
        u => u.username.toLowerCase() === username && u.password === password
      );

      if (!matched) {
        loginErrorMessage = 'ชื่อผู้ใช้งาน (Username) หรือรหัสผ่าน (Password) ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
        renderApp();
        return;
      }

      loginWithAccount(matched.id);
    }

    function loginWithAccount(accountId) {
      const account = getAccount(accountId);
      if (!account) return;

      loginErrorMessage = '';
      appState.currentUser = account.id;

    function switchTab(tabId) {
      const account = getAccount(appState.currentUser);
      if (!account) return;

      // ป้องกันการเข้าถึงแท็บข้ามสิทธิ์ (RBAC Enforcement)
      const adminAllowedTabs = ['approvals', 'inspector', 'central', 'history'];
      const branchAllowedTabs = ['branch_stock', 'branch_requisition', 'branch_history'];

      if (account.roleType === 'admin' && !adminAllowedTabs.includes(tabId)) {
        tabId = 'approvals';
      } else if (account.roleType === 'branch' && !branchAllowedTabs.includes(tabId)) {

    // =========================================================================
    // 6. ADMIN ACTIONS: APPROVE (FULL/PARTIAL), REJECT, RESTOCK, NEW PRODUCT
    // =========================================================================
    function initApprovalDraft(req) {
      if (!appState.approvalDrafts[req.id]) {
        const itemsMap = {};
        req.items.forEach(item => {
          const prod = getProduct(item.productId);
          const available = prod ? prod.stock.central : 0;
          // ค่าเริ่มต้นที่แนะนำ: จ่ายตามที่ขอ แต่ไม่เกินสต็อกคลังกลางที่มี
          itemsMap[item.productId] = Math.min(item.requestedQty, available);
        });
        appState.approvalDrafts[req.id] = {
          items: itemsMap,
          adminNote: ''
        };
      }
      return appState.approvalDrafts[req.id];
    }

    function updateApprovalQty(reqId, productId, rawValue) {
      if (appState.currentUser !== 'admin') return;
      const req = appState.requisitions.find(r => r.id === reqId);
      const prod = getProduct(productId);
      if (!req || !prod) return;

      const draft = initApprovalDraft(req);
      let val = parseInt(rawValue, 10);
      if (isNaN(val) || val < 0) val = 0;

      if (val > prod.stock.central) {
        val = prod.stock.central;
        showToast(
          'จำกัดตามสต็อกคลังกลางคงเหลือ',
          `${prod.name} มีในคลังกลางเพียง ${prod.stock.central} ${prod.unit}`,
          'warning'
        );
      }

      draft.items[productId] = val;
      renderApp();
    }

    function updateApprovalNote(reqId, noteValue) {
      if (appState.currentUser !== 'admin') return;
      const req = appState.requisitions.find(r => r.id === reqId);
      if (!req) return;
      const draft = initApprovalDraft(req);
      draft.adminNote = noteValue;
    }

    function approveRequisition(reqId) {
      if (appState.currentUser !== 'admin') return;
      const req = appState.requisitions.find(r => r.id === reqId);
      if (!req || req.status !== 'pending') return;

      const draft = initApprovalDraft(req);
      const branchAcc = getAccount(req.branchId);

      let totalApprovedUnits = 0;
      let isPartial = false;

      for (const item of req.items) {
        const prod = getProduct(item.productId);
        const approvedQty = Number(draft.items[item.productId] ?? 0);

        if (!prod) continue;
        if (approvedQty < 0 || approvedQty > prod.stock.central) {
          showToast(
            'ไม่สามารถอนุมัติได้',
            `จำนวนจ่ายจริงของ "${prod.name}" (${approvedQty}) เกินสต็อกคลังกลางที่มี (${prod.stock.central})`,
            'error'
          );
          return;
        }
        totalApprovedUnits += approvedQty;
        if (approvedQty < item.requestedQty) {
          isPartial = true;
        }
      }

      if (totalApprovedUnits === 0) {
        showToast(
          'กรุณาระบุจำนวนจ่ายอย่างน้อย 1 รายการ',
          'หากไม่ต้องการจ่ายสินค้าเลย กรุณากดปุ่ม "ปฏิเสธคำขอ"',
          'warning'
        );
        return;
      }

      const nowIso = new Date().toISOString();
      const summaryParts = [];

      req.items.forEach(item => {
        const prod = getProduct(item.productId);
        const approvedQty = Number(draft.items[item.productId] ?? 0);
        item.approvedQty = approvedQty;

        if (prod && approvedQty > 0) {
          prod.stock.central -= approvedQty;
          prod.stock[req.branchId] = (prod.stock[req.branchId] || 0) + approvedQty;

          appState.movements.unshift({
            id: `MOV-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            timestamp: nowIso,
            type: 'dispatch',
            locationId: req.branchId,
            productId: prod.id,
            qtyChange: approvedQty,
            detail: `อนุมัติใบเบิก ${req.id} ให้ ${branchAcc.label} | ขอเบิก ${item.requestedQty} → จ่ายจริง ${approvedQty} ${prod.unit} (คลังกลาง -${approvedQty}, ${branchAcc.label} +${approvedQty})`
          });

          summaryParts.push(`${prod.name}: ขอ ${item.requestedQty} จ่าย ${approvedQty}`);
        } else if (prod && approvedQty === 0) {
          appState.movements.unshift({
            id: `MOV-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            timestamp: nowIso,
            type: 'dispatch',
            locationId: req.branchId,
            productId: prod.id,
            qtyChange: 0,
            detail: `ใบเบิก ${req.id} (${branchAcc.label}) | ขอเบิก ${item.requestedQty} → งดจ่ายรายการนี้ (0 ${prod.unit})`
          });
        }
      });

      req.status = isPartial ? 'approved_partial' : 'approved_full';
      req.processedAt = nowIso;
      req.adminNote = (draft.adminNote || '').trim() || (
        isPartial
          ? 'อนุมัติจ่ายบางส่วนเพื่อสำรองสต็อกแบ่งกระจายให้สาขาอื่นด้วย'
          : 'อนุมัติจ่ายสินค้าครบตามจำนวนที่ขอเบิก'
      );

      delete appState.approvalDrafts[req.id];
      saveState();
      renderApp();

      showToast(
        isPartial
          ? `อนุมัติใบเบิก ${req.id} (อนุมัติบางส่วน) สำเร็จ`
          : `อนุมัติใบเบิก ${req.id} (อนุมัติครบ) สำเร็จ`,
        `ตัดสต็อกคลังกลางและโอนเข้า ${branchAcc.label} เรียบร้อย (${summaryParts.join(', ')})`,
        'success'
      );
    }

    function simulateBranchSale(productId, qty = 1) {
      const account = getAccount(appState.currentUser);
      if (!account || account.roleType !== 'branch') return;

      const branchId = account.id;
      const prod = getProduct(productId);
      if (!prod) return;

      const currentStock = prod.stock[branchId] || 0;
      if (currentStock < qty) {
        showToast(
          'สต็อกหน้าร้านไม่เพียงพอ',
          `${prod.name} คงเหลือเพียง ${currentStock} ${prod.unit} (ไม่พอขาย ${qty} ${prod.unit})`,
          'error'
        );
        return;
      }

      prod.stock[branchId] = currentStock - qty;
      appState.movements.unshift({
        id: `MOV-${Date.now()}`,
        timestamp: new Date().toISOString(),
        type: 'sale',
        locationId: branchId,
        productId: prod.id,
        qtyChange: -qty,
        detail: `ขายหน้าร้าน ${account.label} จำนวน ${qty} ${prod.unit} (คงเหลือหน้าร้าน ${prod.stock[branchId]} ${prod.unit})`
      });

      saveState();
      renderApp();

      const remaining = prod.stock[branchId];
      if (remaining <= prod.minStock) {
        showToast(
          `ขายสินค้าสำเร็จ -${qty} ${prod.unit} (คงเหลือ ${remaining})`,
          `แจ้งเตือน: "${prod.name}" ต่ำกว่าจุดสั่งซื้อขั้นต่ำ (${prod.minStock}) แนะนำให้สร้างใบขอเบิก`,
          'warning'
        );
      } else {
        showToast(
          `บันทึกขายหน้าร้าน -${qty} ${prod.unit}`,
          `${prod.name} คงเหลือหน้าร้าน ${remaining} ${prod.unit}`,
          'success'
        );
      }
    }

    function quickRequestProduct(productId) {
      const account = getAccount(appState.currentUser);
      if (!account || account.roleType !== 'branch') return;

      appState.draftRequisition = {
        note: 'สต็อกหน้าร้านใกล้หมด ขอเบิกเติมสต็อกครับ',
        items: [{ productId, qty: 10 }]
      };
      appState.activeTab = 'branch_requisition';
      saveState();
      renderApp();
    }

    function addDraftRequisitionRow() {
      const usedIds = new Set(appState.draftRequisition.items.map(i => i.productId));
      const nextProd = appState.products.find(p => !usedIds.has(p.id)) || appState.products[0];
      appState.draftRequisition.items.push({
        productId: nextProd.id,
        qty: 5
      });
      saveState();
      renderApp();
    }

    function removeDraftRequisitionRow(index) {
      if (appState.draftRequisition.items.length <= 1) {
        showToast('ต้องมีอย่างน้อย 1 รายการ', 'ใบคำขอเบิกสินค้าต้องมีรายการสินค้าอย่างน้อย 1 รายการ', 'warning');
        return;
      }
      appState.draftRequisition.items.splice(index, 1);
      saveState();
      renderApp();
    }

    function updateDraftRequisitionRow(index, field, value) {
      const row = appState.draftRequisition.items[index];
      if (!row) return;
      if (field === 'productId') {
        row.productId = value;
      } else if (field === 'qty') {
        const parsed = parseInt(value, 10);
        row.qty = isNaN(parsed) || parsed < 1 ? 1 : parsed;
      }
      saveState();
      renderApp();
    }

    function updateDraftRequisitionNote(value) {
      appState.draftRequisition.note = value;
      saveState();
    }

    function submitRequisition() {
      const account = getAccount(appState.currentUser);
      if (!account || account.roleType !== 'branch') return;

      const branchId = account.id;
      const rawItems = appState.draftRequisition.items;

      if (!rawItems || rawItems.length === 0) {
        showToast('กรุณาเพิ่มรายการสินค้า', 'ต้องมีสินค้าอย่างน้อย 1 รายการในใบเบิก', 'error');
        return;
      }

      const mergedMap = new Map();
      for (const item of rawItems) {
        const qty = parseInt(item.qty, 10);
        if (isNaN(qty) || qty <= 0) {
          showToast('จำนวนขอเบิกไม่ถูกต้อง', 'กรุณาระบุจำนวนขอเบิกมากกว่า 0', 'error');
          return;
        }
        mergedMap.set(item.productId, (mergedMap.get(item.productId) || 0) + qty);
      }

      const finalItems = Array.from(mergedMap.entries()).map(([productId, requestedQty]) => ({
        productId,
        requestedQty,
        approvedQty: null
      }));

      const newReqId = generateNextReqId();
      const newReq = {
        id: newReqId,
        branchId,
        createdAt: new Date().toISOString(),
        processedAt: null,
        status: 'pending',
        branchNote: appState.draftRequisition.note.trim() || 'ขอเบิกสินค้าเติมสต็อกหน้าร้าน',
        adminNote: '',
        items: finalItems
      };

      appState.requisitions.unshift(newReq);

      appState.draftRequisition = {
        note: '',
        items: [{ productId: appState.products[0].id, qty: 5 }]
      };
      appState.activeTab = 'branch_history';

      saveState();
      renderApp();
      showToast(
        `ส่งใบคำขอเบิก ${newReqId} สำเร็จ!`,
        `ส่งคำขอเบิก ${finalItems.length} รายการจาก ${account.label} ไปยังคลังกลางเพื่อรออนุมัติแล้ว`,
        'success'
      );
    }

            <p class="text-xs sm:text-sm text-slate-500 mt-1">คุณสามารถกด "ออกจากระบบ" แล้วเข้าสู่ระบบด้วยบัญชี <strong>branch1</strong>, <strong>branch2</strong> หรือ <strong>branch3</strong> เพื่อสร้างใบเบิกใหม่ได้</p>

        : pendingReqs.map(req => {
            const draft = initApprovalDraft(req);
            const branchAcc = getAccount(req.branchId);

            const itemRowsHtml = req.items.map(item => {
              const prod = getProduct(item.productId);
              if (!prod) return '';

              const centralAvail = prod.stock.central;
              const branchCurrent = prod.stock[req.branchId] || 0;
              const approvedQty = Number(draft.items[item.productId] ?? 0);
              const totalDemand = demandMap[prod.id] || 0;
              const otherBranchDemand = Math.max(0, totalDemand - item.requestedQty);

              let statusPill = '';
              if (approvedQty === item.requestedQty && approvedQty > 0) {
                statusPill = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-100 text-emerald-800">อนุมัติครบจำนวน</span>`;
              } else if (approvedQty > 0 && approvedQty < item.requestedQty) {
                statusPill = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-amber-100 text-amber-800">จ่ายบางส่วน (ขาด ${item.requestedQty - approvedQty})</span>`;
              } else {
                statusPill = `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-rose-100 text-rose-700">งดจ่ายรายการนี้ (0)</span>`;

                    <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-slate-500">

                      <span>• คงเหลือที่${escapeHtml(branchAcc.label)}: <strong class="text-slate-700">${branchCurrent} ${escapeHtml(prod.unit)}</strong></span>
                      ${otherBranchDemand > 0
                        ? `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-200 font-semibold">ยอดที่สาขาอื่นกำลังขอเบิกรวม: ${otherBranchDemand} ${escapeHtml(prod.unit)}</span>`

                        <button

                      </div>
                      <div class="mt-1.5">${statusPill}</div>

            }).join('');

            return `

                <div class="bg-gradient-to-r from-emerald-900 to-emerald-800 text-white px-5 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-lg bg-amber-400 text-emerald-950 font-mono text-xs font-extrabold tracking-wide">
                      ${escapeHtml(req.id)}
                    </span>
                    <div>
                      <h4 class="font-bold text-base">${escapeHtml(branchAcc.fullTitle)}</h4>
                      <p class="text-xs text-emerald-200">ส่งคำขอเมื่อ: ${formatThaiDateTime(req.createdAt)}</p>
                    </div>
                  </div>
                  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-200 border border-amber-400/40 self-start sm:self-center">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span>รออนุมัติจากคลังกลาง</span>
                  </span>
                </div>

                <div class="bg-amber-50/70 px-5 py-2.5 border-b border-amber-100 flex items-center gap-2 text-xs text-amber-900">
                  <svg class="w-4 h-4 text-amber-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                  </svg>
                  <span><strong>หมายเหตุจากสาขา:</strong> ${escapeHtml(req.branchNote)}</span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600">
                        <th class="py-3 px-4">รายการสินค้าที่ขอเบิก &amp; ยอดขอเบิกจากสาขาอื่น</th>
                        <th class="py-3 px-3 text-center">สต็อกคงเหลือในคลังกลาง</th>
                        <th class="py-3 px-3 text-center">จำนวนที่สาขาขอเบิก</th>
                        <th class="py-3 px-4 text-center text-amber-800 bg-amber-50/60">จำนวนที่อนุมัติจ่ายจริง</th>

                    </thead>
                    <tbody>
                      ${itemRowsHtml}

                <div class="p-5 bg-slate-50 border-t border-slate-200 flex flex-col lg:flex-row lg:items-end justify-between gap-4">

                    </label>
                    <input
                      type="text"

                      oninput="updateApprovalNote('${req.id}', this.value)"

                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                    />

                  <div class="flex flex-wrap items-center gap-2.5 shrink-0">

                      type="button"
                      onclick="openRejectModal('${req.id}')"

                    >
                      ปฏิเสธคำขอ

                      <span>ยืนยันอนุมัติและตัดสต็อก</span>
                    </button>

      const processedHtml = processedReqs.length === 0 ? '' : `

          <h3 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">

    // =========================================================================
    // 11. ADMIN TAB 2: BRANCH STOCK INSPECTOR (ตรวจสอบสต็อกแต่ละสาขา)
    // =========================================================================
    function renderAdminBranchInspector() {
      const target = appState.inspectedBranchId || 'branch1';
      const branches = getBranchAccounts();

      const selectorButtonsHtml = [
        ...branches.map(b => ({ id: b.id, label: b.label })),
        { id: 'compare', label: 'ภาพรวมเปรียบเทียบทั้ง 3 สาขา' }
      ].map(btn => {
        const isActive = target === btn.id;
        return `
          <button
            type="button"
            onclick="selectInspectedBranch('${btn.id}')"
            class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${
              isActive
                ? 'bg-amber-500 text-emerald-950 shadow-sm'
                : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
            }"
          >
            ${escapeHtml(btn.label)}
          </button>
        `;
      }).join('');

      // View A: เปรียบเทียบทั้ง 3 สาขาพร้อมกัน
      if (target === 'compare') {
        const compareRowsHtml = appState.products.map(p => {
          const b1 = p.stock.branch1 || 0;
          const b2 = p.stock.branch2 || 0;
          const b3 = p.stock.branch3 || 0;
          const sumBranches = b1 + b2 + b3;

          const renderBranchCell = (qty) => {
            if (qty === 0) {
              return `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-100 text-rose-700 tabular-nums">0 (หมดสต็อก)</span>`;
            }
            if (qty <= p.minStock) {
              return `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-800 tabular-nums">${qty} (ใกล้หมด)</span>`;
            }
            return `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-800 tabular-nums">${qty}</span>`;
          };

          return `
            <tr class="hover:bg-slate-50 border-b border-slate-100 last:border-none">
              <td class="py-3.5 px-4 font-mono text-xs text-slate-500">${escapeHtml(p.sku)}</td>
              <td class="py-3.5 px-4">
                <div class="font-semibold text-sm text-slate-900">${escapeHtml(p.name)}</div>
                <span class="text-[11px] text-slate-400">${escapeHtml(p.category)}</span>
              </td>
              <td class="py-3.5 px-3 text-center text-xs text-slate-500">${escapeHtml(p.unit)}</td>
              <td class="py-3.5 px-3 text-center text-xs font-semibold text-slate-600 tabular-nums">${p.minStock}</td>
              <td class="py-3.5 px-3 text-center">${renderBranchCell(b1)}</td>
              <td class="py-3.5 px-3 text-center">${renderBranchCell(b2)}</td>
              <td class="py-3.5 px-3 text-center">${renderBranchCell(b3)}</td>
              <td class="py-3.5 px-3 text-center font-bold text-slate-800 text-sm tabular-nums">${sumBranches}</td>
              <td class="py-3.5 px-4 text-center bg-emerald-50/50 font-bold text-emerald-800 text-sm tabular-nums">${p.stock.central}</td>
            </tr>
          `;

        return `

          </div>

          <div class="flex flex-wrap items-center gap-2 mb-6">
            ${selectorButtonsHtml}
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">

              <h4 class="text-base font-bold text-slate-900">ตารางเปรียบเทียบสต็อกทั้ง 3 สาขา</h4>
              <p class="text-xs text-slate-500 mt-0.5">แสดงจำนวนคงเหลือเทียบกับจุดสั่งซื้อขั้นต่ำ (Min Stock) ของแต่ละสาขา</p>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                    <th class="py-3.5 px-4">รหัสสินค้า</th>
                    <th class="py-3.5 px-4">ชื่อสินค้าอาหารสัตว์</th>
                    <th class="py-3.5 px-3 text-center">หน่วย</th>
                    <th class="py-3.5 px-3 text-center">Min Stock</th>
                    <th class="py-3.5 px-3 text-center">สาขา 1 (ในเมือง)</th>
                    <th class="py-3.5 px-3 text-center">สาขา 2 (รอบเมือง)</th>
                    <th class="py-3.5 px-3 text-center">สาขา 3 (อำเภอ)</th>
                    <th class="py-3.5 px-3 text-center">รวม 3 สาขา</th>
                    <th class="py-3.5 px-4 text-center bg-emerald-50/70 text-emerald-900">คลังกลาง</th>
                  </tr>
                </thead>
                <tbody>
                  ${compareRowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // View B: ตรวจสอบเจาะจงรายสาขา (branch1 / branch2 / branch3)
      const branchAcc = getAccount(target) || branches[0];
      const branchPendingMap = getBranchPendingDemandMap(branchAcc.id);

      const totalSkus = appState.products.length;
      const totalBranchUnits = appState.products.reduce((sum, p) => sum + (p.stock[branchAcc.id] || 0), 0);
      const lowOrOutCount = appState.products.filter(p => (p.stock[branchAcc.id] || 0) <= p.minStock).length;
      const totalIncomingPending = Object.values(branchPendingMap).reduce((a, b) => a + b, 0);

      const branchRowsHtml = appState.products.map(p => {
        const qty = p.stock[branchAcc.id] || 0;
        const incomingQty = branchPendingMap[p.id] || 0;

        let statusBadge = '';
        if (qty === 0) {
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700">หมดสต็อก</span>`;

          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">ใกล้หมด</span>`;

            <td class="py-3.5 px-4 font-semibold text-sm text-slate-900">${escapeHtml(p.name)}</td>

              <span class="px-2.5 py-0.5 rounded-md text-xs bg-slate-100 text-slate-700 font-medium">${escapeHtml(p.category)}</span>

              }">${qty}</span>
            </td>
            <td class="py-3.5 px-3 text-center text-xs font-semibold text-slate-600 tabular-nums">${p.minStock}</td>
            <td class="py-3.5 px-3 text-center">${statusBadge}</td>
            <td class="py-3.5 px-4 text-center">
              ${incomingQty > 0
                ? `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-900 tabular-nums">+${incomingQty} ${escapeHtml(p.unit)}</span>`
                : `<span class="text-xs text-slate-400">-</span>`
              }
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="mb-5">
          <h3 class="text-lg font-bold text-slate-900">ตรวจสอบสต็อกแต่ละสาขา (Branch Stock Inspector)</h3>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5">เลือกดูข้อมูลสต็อกรายสาขาอย่างละเอียด เพื่อวางแผนอนุมัติและกระจายสินค้าได้อย่างเหมาะสม</p>
        </div>

        <!-- Branch Selector Buttons -->
        <div class="flex flex-wrap items-center gap-2 mb-6">
          ${selectorButtonsHtml}
        </div>

        <!-- 4 KPI Cards for Selected Branch -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">จำนวนรายการสินค้าทั้งหมด</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold text-slate-900 tabular-nums">${totalSkus}</span>
              <span class="text-xs text-slate-500">รายการ (SKU)</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(branchAcc.label)}</p>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">จำนวนกระสอบ/หน่วยรวมในสาขา</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold text-emerald-700 tabular-nums">${totalBranchUnits}</span>
              <span class="text-xs text-slate-500">กระสอบ / ถุง</span>
            </div>
            <p class="text-xs text-emerald-600 font-medium mt-1">สต็อกพร้อมขายหน้าร้าน</p>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">สินค้าใกล้หมด / หมดสต็อก</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold ${lowOrOutCount > 0 ? 'text-rose-600' : 'text-slate-900'} tabular-nums">${lowOrOutCount}</span>
              <span class="text-xs text-slate-500">รายการ</span>
            </div>
            <p class="text-xs text-rose-600 font-medium mt-1">${lowOrOutCount > 0 ? 'ต่ำกว่าหรือเท่ากับ Min Stock' : 'สต็อกอยู่ในเกณฑ์ปกติ'}</p>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">

    function renderAdminAuditLogs() {
      const filter = appState.historyFilter;

      const filtered = appState.movements.filter(m => {
        if (filter.location !== 'all' && m.locationId !== filter.location) {
          return false;
        }
        if (filter.type !== 'all' && m.type !== filter.type) {
          return false;
        }
        if (filter.search) {
          const prod = getProduct(m.productId);
          const text = `${m.detail} ${prod ? prod.name : ''} ${prod ? prod.sku : ''}`.toLowerCase();
          if (!text.includes(filter.search.toLowerCase())) return false;
        }
        return true;
      });

      const typeBadgeMap = {
        restock: { label: 'รับเข้าคลังกลาง', cls: 'bg-emerald-100 text-emerald-800' },
        dispatch: { label: 'อนุมัติจ่ายให้สาขา', cls: 'bg-amber-100 text-amber-800' },
        sale: { label: 'ขายหน้าร้านสาขา', cls: 'bg-sky-100 text-sky-800' },
        new_product: { label: 'เพิ่มสินค้าใหม่', cls: 'bg-purple-100 text-purple-800' }
      };

      const rowsHtml = filtered.length === 0
        ? `<tr><td colspan="5" class="py-10 text-center text-sm text-slate-400">ไม่พบประวัติการเคลื่อนไหวสต็อกตามเงื่อนไขที่เลือก</td></tr>`
        : filtered.map(m => {
            const prod = getProduct(m.productId);
            const locLabel = m.locationId === 'central'
              ? 'คลังกลาง'
              : (getAccount(m.locationId)?.label || m.locationId);
            const tb = typeBadgeMap[m.type] || { label: m.type, cls: 'bg-slate-100 text-slate-700' };

            return `
              <tr class="hover:bg-slate-50 border-b border-slate-100 last:border-none">
                <td class="py-3 px-4 text-xs text-slate-500 whitespace-nowrap">${formatThaiDateTime(m.timestamp)}</td>
                <td class="py-3 px-3">

                <td class="py-3 px-3 text-xs font-semibold text-slate-700">${escapeHtml(locLabel)}</td>
                <td class="py-3 px-4">

                <td class="py-3 px-4 text-right font-bold text-sm tabular-nums ${

                }">
                  ${m.qtyChange > 0 ? `+${m.qtyChange}` : m.qtyChange} ${escapeHtml(prod ? prod.unit : '')}
                </td>
              </tr>
            `;
          }).join('');

      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="p-5 border-b border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-4">

              >
                <option value="all" ${filter.location === 'all' ? 'selected' : ''}>ทุกสาขา &amp; คลังกลาง</option>
                <option value="central" ${filter.location === 'central' ? 'selected' : ''}>คลังกลาง</option>

                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <!-- Branch KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">สต็อกหน้าร้านคงเหลือ</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold text-emerald-700 tabular-nums">${totalBranchUnits}</span>
              <span class="text-xs text-slate-500">กระสอบ / ถุง</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(account.label)}</p>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">สินค้าใกล้หมด / หมดสต็อก</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold ${lowStockProducts.length > 0 ? 'text-rose-600' : 'text-slate-900'} tabular-nums">${lowStockProducts.length}</span>
              <span class="text-xs text-slate-500">รายการ</span>
            </div>
            <p class="text-xs text-rose-600 font-medium mt-1">${lowStockProducts.length > 0 ? 'ควรส่งใบขอเบิกเติมสต็อก' : 'สต็อกหน้าร้านเพียงพอ'}</p>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">ใบเบิกรออนุมัติ</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold text-amber-600 tabular-nums">${myPendingReqs.length}</span>
              <span class="text-xs text-slate-500">ใบเบิก</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">รอคลังกลางอนุมัติจัดส่ง</p>
          </div>

          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
            <span class="text-xs font-semibold text-slate-500 uppercase">ใบเบิกที่อนุมัติแล้ว</span>
            <div class="mt-2 flex items-baseline gap-2">
              <span class="text-2xl sm:text-3xl font-bold text-slate-900 tabular-nums">${myCompletedReqs.length}</span>
              <span class="text-xs text-slate-500">ใบเบิก</span>
            </div>
            <p class="text-xs text-emerald-600 font-medium mt-1">รับสินค้าเข้าสาขาเรียบร้อย</p>
          </div>
        </div>

        <!-- Branch Inventory & POS Table -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="p-5 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900">รายการสินค้าคงเหลือหน้าร้าน — ${escapeHtml(account.label)}</h3>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">กดปุ่ม <strong>"ขาย -1"</strong> หรือ <strong>"ขาย -5"</strong> เพื่อจำลองการขายหน้าร้านตัดสต็อก หรือสร้างใบขอเบิกจากคลังกลาง</p>
            </div>
            <button
              onclick="switchTab('branch_requisition')"
              class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-700 hover:bg-emerald-800 text-white shadow-sm transition shrink-0 cursor-pointer"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
              <span>สร้างใบขอเบิกสินค้าจากคลังกลาง</span>
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                  <th class="py-3.5 px-4">รหัสสินค้า</th>
                  <th class="py-3.5 px-4">ชื่อสินค้าอาหารสัตว์</th>
                  <th class="py-3.5 px-3 text-center">คงเหลือหน้าร้าน</th>
                  <th class="py-3.5 px-3 text-center">จุดสั่งซื้อขั้นต่ำ</th>
                  <th class="py-3.5 px-3 text-center">สถานะสต็อก</th>
                  <th class="py-3.5 px-4 text-right">บันทึกการขาย / ขอเบิก</th>
                </tr>
              </thead>
              <tbody>
                ${productRowsHtml}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderBranchRequisitionBuilder(account) {
      const branchId = account.id;
      const draft = appState.draftRequisition;

      const rowsHtml = draft.items.map((row, idx) => {
        const selectedProd = getProduct(row.productId) || appState.products[0];
        const branchQty = selectedProd.stock[branchId] || 0;

        // แสดงเฉพาะสต็อกของสาขาตนเองในรายการเลือก (ไม่เปิดเผยสต็อกคลังกลางหรือสาขาอื่น)
        const optionsHtml = appState.products.map(p => `
          <option value="${p.id}" ${p.id === row.productId ? 'selected' : ''}>
            [${escapeHtml(p.sku)}] ${escapeHtml(p.name)} (คงเหลือสาขานี้: ${p.stock[branchId] || 0} ${escapeHtml(p.unit)})
          </option>
        `).join('');

        return `
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col md:flex-row md:items-center gap-3">
            <div class="flex items-center gap-2.5 flex-1">
              <span class="w-7 h-7 rounded-lg bg-emerald-700 text-white text-xs font-bold flex items-center justify-center shrink-0">
                ${idx + 1}
              </span>
              <div class="flex-1">
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">เลือกชื่อสินค้าอาหารสัตว์</label>
                <select
                  onchange="updateDraftRequisitionRow(${idx}, 'productId', this.value)"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-medium text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none"
                >
                  ${optionsHtml}
                </select>
                <div class="flex flex-wrap items-center gap-3 mt-1.5 text-xs text-slate-500">
                  <span>คงเหลือปัจจุบันที่${escapeHtml(account.label)}: <strong class="text-slate-800">${branchQty} ${escapeHtml(selectedProd.unit)}</strong></span>
                  <span>• จุดสั่งซื้อขั้นต่ำ: <strong>${selectedProd.minStock} ${escapeHtml(selectedProd.unit)}</strong></span>
                </div>
              </div>
            </div>

            <div class="flex items-end gap-3 justify-between md:justify-end">
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">จำนวนที่ต้องการเบิก (${escapeHtml(selectedProd.unit)})</label>
                <div class="inline-flex items-center rounded-xl border border-slate-300 bg-white p-1">
                  <button
                    type="button"
                    onclick="updateDraftRequisitionRow(${idx}, 'qty', ${row.qty - 1})"
                    class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-700 font-bold flex items-center justify-center cursor-pointer"
                  >-</button>
                  <input
                    type="number"
                    min="1"
                    value="${row.qty}"
                    onchange="updateDraftRequisitionRow(${idx}, 'qty', this.value)"
                    class="w-16 text-center text-sm font-bold text-slate-900 outline-none tabular-nums"
                  />
                  <button
                    type="button"
                    onclick="updateDraftRequisitionRow(${idx}, 'qty', ${row.qty + 1})"
                    class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-700 font-bold flex items-center justify-center cursor-pointer"
                  >+</button>
                </div>
              </div>

              <button
                type="button"
                onclick="removeDraftRequisitionRow(${idx})"
                title="ลบรายการนี้"
                class="p-2.5 rounded-xl text-rose-600 hover:bg-rose-100 border border-transparent hover:border-rose-200 transition cursor-pointer"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="max-w-4xl mx-auto">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="bg-emerald-900 text-white px-6 py-5 flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-amber-300">ใบคำขอเบิกสินค้าจากคลังกลาง</span>
                <h3 class="text-lg sm:text-xl font-bold mt-0.5">สร้างใบขอเบิกสินค้า — ${escapeHtml(account.fullTitle)}</h3>
              </div>
              <span class="hidden sm:inline-block px-3 py-1.5 rounded-xl bg-emerald-800 border border-emerald-700 font-mono text-xs text-emerald-100">
                เลขที่ใบเบิก: ${generateNextReqId()}
              </span>
            </div>

            <div class="p-6 space-y-5">
              <div class="flex items-center justify-between">
                <h4 class="text-sm font-bold text-slate-800">รายการสินค้าที่ต้องการเบิก (${draft.items.length} รายการ)</h4>
                <button
                  type="button"
                  onclick="addDraftRequisitionRow()"
                  class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-100 hover:bg-amber-200 text-amber-900 transition cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                  </svg>
                  <span>+ เพิ่มรายการสินค้า</span>
                </button>
              </div>

              <div class="space-y-3">
                ${rowsHtml}
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">หมายเหตุถึงผู้ดูแลคลังกลาง</label>
                <textarea
                  rows="2"
                  oninput="updateDraftRequisitionNote(this.value)"
                  placeholder="ระบุเหตุผลการขอเบิก เช่น ลูกค้าสั่งจองล่วงหน้า หรือสต็อกหน้าร้านใกล้หมด..."
                  class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                >${escapeHtml(draft.note)}</textarea>
              </div>

              <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <p class="text-xs text-slate-500">
                  * เมื่อส่งคำขอแล้ว ผู้ดูแลคลังกลางจะพิจารณาอนุมัติจำนวนจ่ายจริงและโอนสต็อกเข้าสาขาของคุณ
                </p>
                <button
                  type="button"
                  onclick="submitRequisition()"
                  class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-sm font-bold bg-emerald-700 hover:bg-emerald-800 text-white shadow-md transition cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                  </svg>
                  <span>ส่งใบคำขอเบิกไปยังคลังกลาง</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBranchRequisitionHistory(account) {
      const branchId = account.id;
      const myReqs = appState.requisitions.filter(r => r.branchId === branchId);

      const cardsHtml = myReqs.length === 0
        ? `
          <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
            <h4 class="text-base font-bold text-slate-800">ยังไม่มีประวัติใบคำขอเบิกสินค้าของสาขานี้</h4>
            <p class="text-sm text-slate-500 mt-1 mb-4">เริ่มต้นสร้างใบคำขอเบิกสินค้าอาหารสัตว์จากคลังกลางได้เลย</p>
            <button onclick="switchTab('branch_requisition')" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-emerald-700 text-white hover:bg-emerald-800 transition cursor-pointer">
              + สร้างใบขอเบิกสินค้า
            </button>
          </div>
        `
        : myReqs.map(req => renderRequisitionSummaryCard(req, false)).join('');

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <h3 class="text-lg font-bold text-slate-900">ประวัติใบขอเบิกของสาขา — ${escapeHtml(account.label)}</h3>
            <p class="text-xs sm:text-sm text-slate-500">ตรวจสอบสถานะใบเบิก เปรียบเทียบจำนวนที่ขอเบิกกับจำนวนที่คลังกลางอนุมัติจ่ายจริง</p>
          </div>
          <button
            onclick="switchTab('branch_requisition')"
            class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-700 hover:bg-emerald-800 text-white shadow-xs transition self-start sm:self-center cursor-pointer"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
            <span>สร้างใบขอเบิกใหม่</span>
          </button>
        </div>

        <div class="space-y-4">
          ${cardsHtml}
        </div>
      `;
    }

    /**
     * การ์ดสรุปรายละเอียดใบเบิก (ใช้แสดงผลทั้งฝั่งสาขาและประวัติฝั่ง Admin)
     */
    function renderRequisitionSummaryCard(req, showBranchName = false) {
      const branchAcc = getAccount(req.branchId);

      const statusConfig = {
        pending: {
          label: 'รออนุมัติจากคลังกลาง',
          badge: 'bg-amber-100 text-amber-800 border-amber-200',
          border: 'border-amber-200'
        },
        approved_full: {
          label: 'อนุมัติครบ',
          badge: 'bg-emerald-100 text-emerald-800 border-emerald-200',
          border: 'border-emerald-200'
        },
        approved_partial: {
          label: 'อนุมัติบางส่วน',
          badge: 'bg-amber-500 text-white border-amber-500',
          border: 'border-amber-300'
        },
        rejected: {
          label: 'ปฏิเสธคำขอ',
          badge: 'bg-rose-100 text-rose-700 border-rose-200',
          border: 'border-rose-200'
        }
      };

      const st = statusConfig[req.status] || statusConfig.pending;

      const itemsHtml = req.items.map(item => {
        const prod = getProduct(item.productId);
        const prodName = prod ? prod.name : item.productId;
        const unit = prod ? prod.unit : 'หน่วย';

        let actualDisplay = '';
        if (req.status === 'pending') {
          actualDisplay = `<span class="text-xs text-slate-400 italic">รอพิจารณา...</span>`;
        } else if (req.status === 'rejected') {
          actualDisplay = `<span class="text-xs font-bold text-rose-600">0 ${escapeHtml(unit)} (ไม่อนุมัติ)</span>`;
        } else {
          const isItemPartial = item.approvedQty < item.requestedQty;
          actualDisplay = `
            <span class="text-sm font-extrabold tabular-nums ${isItemPartial ? 'text-amber-700' : 'text-emerald-700'}">
              ${item.approvedQty} ${escapeHtml(unit)}
            </span>
            ${isItemPartial
              ? `<span class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">แบ่งจ่าย</span>`
              : `<span class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">ครบจำนวน</span>`
            }
          `;
        }

        return `
          <tr class="border-b border-slate-100 last:border-none">
            <td class="py-2.5 px-4 text-sm font-medium text-slate-800">${escapeHtml(prodName)}</td>
            <td class="py-2.5 px-4 text-center text-sm font-semibold text-slate-700 tabular-nums">${item.requestedQty} ${escapeHtml(unit)}</td>
            <td class="py-2.5 px-4 text-center">${actualDisplay}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="bg-white rounded-2xl border ${st.border} shadow-2xs overflow-hidden">
          <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2.5">
              <span class="font-mono text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-800 text-white">${escapeHtml(req.id)}</span>
              ${showBranchName && branchAcc ? `<span class="text-sm font-bold text-emerald-800">${escapeHtml(branchAcc.fullTitle)}</span>` : ''}
              <span class="text-xs text-slate-500">ส่งเมื่อ: ${formatThaiDateTime(req.createdAt)}</span>
              ${req.processedAt ? `<span class="text-xs text-slate-500">• ดำเนินการเมื่อ: ${formatThaiDateTime(req.processedAt)}</span>` : ''}
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold border ${st.badge}">
              ${st.label}
            </span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="text-[11px] font-bold text-slate-500 uppercase border-b border-slate-100 bg-slate-50/40">
                  <th class="py-2 px-4">รายการสินค้า</th>
                  <th class="py-2 px-4 text-center">ขอเบิกกี่หน่วย</th>
                  <th class="py-2 px-4 text-center">คลังกลางอนุมัติจ่ายจริงกี่หน่วย</th>
                </tr>
              </thead>
              <tbody>
                ${itemsHtml}
              </tbody>
            </table>
          </div>

          <div class="px-5 py-3 bg-slate-50/70 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
            <div class="text-slate-600">
              <strong>หมายเหตุสาขา:</strong> ${escapeHtml(req.branchNote || '-')}
            </div>
            ${req.adminNote
              ? `<div class="text-emerald-900 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg">
                  <strong>หมายเหตุจากผู้ดูแลคลังกลาง:</strong> ${escapeHtml(req.adminNote)}
                </div>`
              : ''
            }
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 15. MAIN APPLICATION RENDER ORCHESTRATOR
    // =========================================================================
    function renderApp() {
      const rootEl = document.getElementById('appRoot');
      const account = getAccount(appState.currentUser);

      // หากยังไม่ได้ล็อคอิน แสดงหน้า Login
      if (!account) {
        rootEl.innerHTML = renderLoginScreen();
        return;
      }

      // ตรวจสอบสิทธิ์การเข้าถึงแท็บตาม Role-Based Access Control
      let contentHtml = '';
      if (account.roleType === 'admin') {
        if (appState.activeTab === 'inspector') {
          contentHtml = renderAdminBranchInspector();
        } else if (appState.activeTab === 'central') {
          contentHtml = renderAdminCentralWarehouse();
        } else if (appState.activeTab === 'history') {
          contentHtml = renderAdminAuditLogs();
        } else {
          appState.activeTab = 'approvals';
          contentHtml = renderAdminApprovals();
        }
      } else {
        if (appState.activeTab === 'branch_requisition') {
          contentHtml = renderBranchRequisitionBuilder(account);
        } else if (appState.activeTab === 'branch_history') {
          contentHtml = renderBranchRequisitionHistory(account);
        } else {
          appState.activeTab = 'branch_stock';
          contentHtml = renderBranchStockAndPOS(account);
        }
      }

      rootEl.innerHTML = renderAuthenticatedShell(account, contentHtml);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const accountFromNext = new URLSearchParams(window.location.search).get('account');
      if (accountFromNext && getAccount(accountFromNext)) {
        appState.currentUser = accountFromNext;
        const account = getAccount(accountFromNext);
        appState.activeTab = account.roleType === 'admin' ? 'approvals' : 'branch_stock';
        saveState();
      }
      renderApp();
    });
  </script>
</body>
</html>
